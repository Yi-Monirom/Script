---
- name: Configure L2 Edge Switches (VLANs, trunks, EtherChannel)
  hosts: switches
  gather_facts: no
  connection: network_cli

  tasks:
    - name: Create switch backup directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../backups/switches"
        state: directory
      run_once: true
      delegate_to: localhost

    - name: Backup running-config before changes
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: backup_running_cfg
      changed_when: false

    - name: Save switch backup locally
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ backup_running_cfg.stdout[0] }}"
        dest: "{{ playbook_dir }}/../backups/switches/{{ inventory_hostname }}_{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}.cfg"

    - name: Set hostname
      ios_config:
        lines:
          - hostname {{ hostname }} 
    - name: Create VLANs
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
        state: merged
      loop: "{{ l2_vlans }}"

    - name: Configure access ports
      ios_config:
        lines:
          - description {{ item.description }}
          - switchport mode access
          - switchport access vlan {{ item.vlan }}
          - no shutdown
        parents: interface {{ item.name }}
      loop: "{{ access_ports | default([]) }}"
      when: access_ports is defined

    - name: Configure EtherChannel trunk (Port-channel)
      ios_config:
        lines:
          - description EtherChannel_Redundancy
          - switchport
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan {{ port_channel_allowed_vlans }}
          - no shutdown
        parents: interface Port-channel{{ port_channel_id }}
      when: port_channel_allowed_vlans is defined

    - name: Add member ports to EtherChannel
      cisco.ios.ios_config:
        lines:
          - description {{ item.description }}
          - switchport
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - channel-group {{ port_channel_id }} mode active
          - no shutdown
        parents: interface {{ item.name }}
      loop: "{{ etherchannel_members }}"

    - name: Configure firewall EtherChannel trunk (Port-channel{{ fw_port_channel_id }})
      cisco.ios.ios_config:
        lines:
          - description LAG_to_Firewall
          - switchport
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan {{ fw_port_channel_allowed_vlans }}
          - no shutdown
        parents: interface Port-channel{{ fw_port_channel_id }}
      when: fw_lag_trunk_ports is defined

    - name: Add firewall EtherChannel member ports
      cisco.ios.ios_config:
        lines:
          - description {{ item.description }}
          - switchport
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan {{ fw_port_channel_allowed_vlans }}
          - channel-group {{ fw_port_channel_id }} mode active
          - no shutdown
        parents: interface {{ item.name }}
      loop: "{{ fw_lag_trunk_ports }}"
      when: fw_lag_trunk_ports is defined

    - name: Configure firewall cross EtherChannel trunk (Port-channel{{ fw_cross_port_channel_id }})
      cisco.ios.ios_config:
        lines:
          - description Cross_LAG_to_Other_FW
          - switchport
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan {{ fw_port_channel_allowed_vlans }}
          - no shutdown
        parents: interface Port-channel{{ fw_cross_port_channel_id }}
      when: fw_cross_lag_trunk_ports is defined

    - name: Add firewall cross EtherChannel member ports
      cisco.ios.ios_config:
        lines:
          - description {{ item.description }}
          - switchport
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan {{ fw_port_channel_allowed_vlans }}
          - channel-group {{ fw_cross_port_channel_id }} mode active
          - no shutdown
        parents: interface {{ item.name }}
      loop: "{{ fw_cross_lag_trunk_ports }}"
      when: fw_cross_lag_trunk_ports is defined

    - name: Configure trunk ports to firewalls / LAN
      ios_config:
        lines:
          - description {{ item.description }}
          - switchport
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan {{ item.allowed_vlans }}
          - no shutdown
        parents: interface {{ item.name }}
      loop: "{{ edge_trunk_ports }}"

    - name: Configure LAN-facing trunk ports (core switches)
      ios_config:
        lines:
          - description {{ item.description }}
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - switchport trunk allowed vlan {{ item.allowed_vlans }}
          - no shutdown
        parents: interface {{ item.name }}
      loop: "{{ lan_ports | default([]) }}"
      when: lan_ports is defined

    - name: Configure login protection
      ios_config:
        lines:
          - login block-for 120 attempts 4 within 60

    - name: Save running configuration to startup
      ios_config:
        save_when: modified

    - name: Verify EtherChannel status
      ios_command:
        commands:
          - show etherchannel summary
      register: etherchannel_status

    - name: Display EtherChannel summary
      debug:
        var: etherchannel_status.stdout_lines