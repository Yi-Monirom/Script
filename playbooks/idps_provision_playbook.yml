---
# ==============================================================================
# Playbook: idps_provision_playbook.yml
# Target  : idps-server (192.168.30.50, Ubuntu 22.04 LTS)
# Purpose : End-to-end provisioning of Suricata IDS/IPS engine with both:
#           1. Custom thesis detection rules (/etc/suricata/rules/thesis.rules)
#           2. Automated latest Internet threat intelligence feeds (suricata-update:
#              et/open, oisf/trafficid, abuse.ch/urlhaus, tgreen/hunting, etc.)
#           3. EveBox Web UI dashboard for alert analysis and event visualization.
# ==============================================================================
- name: Provision IDS/IPS server - Suricata + Internet Threat Feeds + EveBox on Ubuntu 22.04
  hosts: idps
  gather_facts: no

  vars:
    ansible_ssh_common_args: '-o ProxyJump=root@192.168.71.149 -o StrictHostKeyChecking=no'
    expected_ip: 192.168.30.50
    gateway: 192.168.30.1
    mirror_interface: ens3
    home_net: '[192.168.10.0/24,192.168.20.0/24,192.168.30.0/24]'
    suricata_config: /etc/suricata/suricata.yaml
    rules_dir: /etc/suricata/rules
    thesis_rules_src: ../files/thesis.rules
    # Internet rule feeds enabled via suricata-update
    suricata_sources:
      - et/open
      - oisf/trafficid
      - abuse.ch/urlhaus
      - abuse.ch/sslbl-blacklist
      - abuse.ch/sslbl-ja3
      - tgreen/hunting

  tasks:

    # --------------------------------------------------------------------------
    # 1. Connectivity & Pre-flight Diagnostics
    # --------------------------------------------------------------------------
    - name: Verify reachability through Kali jumphost
      ansible.builtin.raw: hostname && whoami && lsb_release -ds
      register: reach
      changed_when: false

    - name: Show target OS identity
      ansible.builtin.debug:
        var: reach.stdout_lines

    - name: Confirm static IP {{ expected_ip }} is bound
      ansible.builtin.command: ip -4 -o addr show scope global
      register: ip_out
      changed_when: false

    - name: Assert static IP {{ expected_ip }} is present
      ansible.builtin.assert:
        that:
          - expected_ip in ip_out.stdout
        fail_msg: "{{ expected_ip }} is NOT bound on this host. Configure netplan first."
        success_msg: "Static IP {{ expected_ip }} is active."

    - name: Check default gateway route
      ansible.builtin.command: ip route show default
      register: route_out
      changed_when: false

    - name: Assert gateway route via {{ gateway }}
      ansible.builtin.assert:
        that:
          - gateway in route_out.stdout
        fail_msg: "No default route via {{ gateway }}. Check VLAN 300 uplink."
        success_msg: "Default route via {{ gateway }} present."

    # --------------------------------------------------------------------------
    # 2. Package Installation & System Account Setup
    # --------------------------------------------------------------------------
    - name: Check if Suricata is installed
      ansible.builtin.command: which suricata
      register: suricata_check
      failed_when: false
      changed_when: false

    - name: Ensure APT prerequisites are installed
      ansible.builtin.raw: apt-get update && apt-get install -y software-properties-common python3-apt curl jq
      when: suricata_check.rc != 0
      changed_when: false

    - name: Enable Suricata stable PPA repository
      ansible.builtin.apt_repository:
        repo: ppa:oisf/suricata-stable
        state: present
        update_cache: true
      when: suricata_check.rc != 0

    - name: Install Suricata and suricata-update
      ansible.builtin.apt:
        name:
          - suricata
          - suricata-update
        state: present
        update_cache: true
      when: suricata_check.rc != 0

    - name: Ensure suricata system group exists
      ansible.builtin.group:
        name: suricata
        system: true
        state: present

    - name: Ensure suricata system user exists
      ansible.builtin.user:
        name: suricata
        group: suricata
        home: /var/log/suricata
        shell: /sbin/nologin
        system: true
        create_home: false
        state: present

    - name: Ensure directory structures exist with proper permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('suricata') }}"
        group: "{{ item.group | default('suricata') }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "{{ rules_dir }}", owner: root, group: root, mode: '0755' }
        - { path: /var/log/suricata, owner: suricata, group: suricata, mode: '0755' }
        - { path: /var/lib/suricata, owner: suricata, group: suricata, mode: '0755' }
        - { path: /var/lib/evebox, owner: root, group: root, mode: '0755' }

    # --------------------------------------------------------------------------
    # 3. Rule Management (Local Thesis Rules + Internet Threat Feeds)
    # --------------------------------------------------------------------------
    - name: Read local copy of thesis.rules (base64)
      ansible.builtin.command: bash -c "base64 -w0 {{ thesis_rules_src }}"
      delegate_to: localhost
      run_once: true
      register: rules_b64
      changed_when: false

    - name: Deploy custom thesis.rules to IDS server
      ansible.builtin.copy:
        content: "{{ rules_b64.stdout | b64decode }}"
        dest: "{{ rules_dir }}/thesis.rules"
        owner: root
        group: root
        mode: '0644'
        backup: true

    - name: Fetch index of available threat intelligence sources from internet
      ansible.builtin.command: suricata-update update-sources
      changed_when: false

    - name: Enable threat intelligence rule sources from internet
      ansible.builtin.command: "suricata-update enable-source {{ item }}"
      loop: "{{ suricata_sources }}"
      register: enable_src_out
      changed_when: "'enabled' in enable_src_out.stdout"
      failed_when: false

    - name: Download latest rules and compile into suricata.rules
      ansible.builtin.command: suricata-update --no-reload
      register: rule_update
      changed_when: "'Writing rules' in rule_update.stdout or 'Writing Rules' in rule_update.stdout"

    - name: Extract individual rule category files into {{ rules_dir }}
      ansible.builtin.shell: |
        tar --wildcards -xzf /var/lib/suricata/update/cache/*emerging.rules.tar.gz -C {{ rules_dir }}/ --strip-components=1 'rules/*.rules' 2>/dev/null || true
        chmod 644 {{ rules_dir }}/*.rules 2>/dev/null || true
      changed_when: false

    # --------------------------------------------------------------------------
    # 4. Configure /etc/suricata/suricata.yaml cleanly
    # --------------------------------------------------------------------------
    - name: Configure HOME_NET, mirror interface, and rule files in suricata.yaml
      ansible.builtin.shell: |
        python3 -c "
        import re

        config_path = '{{ suricata_config }}'
        with open(config_path, 'r') as f:
            content = f.read()

        # 1. Ensure HOME_NET is set to lab subnets
        content = re.sub(
            r'HOME_NET:\s*\"[^\"]*\"',
            'HOME_NET: \"{{ home_net }}\"',
            content,
            count=1
        )

        # 2. Ensure af-packet interface is set to mirror interface
        content = re.sub(
            r'af-packet:\s*\n\s*-\s*interface:\s*\S+',
            'af-packet:\n  - interface: {{ mirror_interface }}',
            content,
            count=1
        )

        # 3. Ensure default-rule-path is /var/lib/suricata/rules
        if 'default-rule-path: /var/lib/suricata/rules' not in content:
            content = re.sub(
                r'default-rule-path:\s*\S+',
                'default-rule-path: /var/lib/suricata/rules',
                content,
                count=1
            )

        # 4. Clean up any misplaced rule-files and ensure clean active rule-files block
        # Ensure /etc/suricata/rules/thesis.rules is included under rule-files
        if '/etc/suricata/rules/thesis.rules' not in content:
            content = content.replace(
                'rule-files:\n  - suricata.rules',
                'rule-files:\n  - suricata.rules\n  - /etc/suricata/rules/thesis.rules'
            )

        with open(config_path, 'w') as f:
            f.write(content)
        print('SURICATA_CONFIG_SYNCHRONIZED')
        "
      register: yaml_sync
      changed_when: "'SURICATA_CONFIG_SYNCHRONIZED' in yaml_sync.stdout"

    - name: Fix file permissions on Suricata directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: suricata
        group: suricata
        recurse: true
      loop:
        - /var/log/suricata
        - /var/lib/suricata

    # --------------------------------------------------------------------------
    # 5. Validate Configuration & Restart Suricata
    # --------------------------------------------------------------------------
    - name: Validate Suricata configuration (suricata -T)
      ansible.builtin.command: suricata -T -c {{ suricata_config }}
      register: config_test
      changed_when: false

    - name: Enable and restart Suricata service
      ansible.builtin.systemd:
        name: suricata
        enabled: true
        state: restarted

    # --------------------------------------------------------------------------
    # 6. Install & Configure EveBox Web Dashboard
    # --------------------------------------------------------------------------
    - name: Check if EveBox binary exists
      ansible.builtin.command: which evebox
      register: evebox_bin_check
      failed_when: false
      changed_when: false

    - name: Install EveBox binary via official installer (if missing)
      ansible.builtin.shell: curl -sSf https://evebox.org/install.sh | sh
      when: evebox_bin_check.rc != 0
      register: eve_install
      changed_when: true

    - name: Ensure eve.json log file exists
      ansible.builtin.file:
        path: /var/log/suricata/eve.json
        state: touch
        owner: suricata
        group: suricata
        mode: '0644'
        modification_time: preserve
        access_time: preserve

    - name: Deploy EveBox systemd service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/evebox.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=EveBox Server
          After=network.target suricata.service
          Wants=suricata.service

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/evebox server --host 0.0.0.0 --port 5636 --input /var/log/suricata/eve.json --sqlite --data-directory /var/lib/evebox --no-auth --no-tls
          Restart=always
          RestartSec=5
          LimitNOFILE=65535

          [Install]
          WantedBy=multi-user.target
      register: evebox_unit

    - name: Reload systemd daemon if EveBox unit changed
      ansible.builtin.systemd:
        daemon_reload: true
      when: evebox_unit.changed

    - name: Enable and start EveBox service
      ansible.builtin.systemd:
        name: evebox
        enabled: true
        state: restarted

    # --------------------------------------------------------------------------
    # 7. Verification & Summary Report
    # --------------------------------------------------------------------------
    - name: Query installed Suricata version and build info
      ansible.builtin.command: suricata -V
      register: suri_ver
      changed_when: false

    - name: Confirm listening ports (5636 EveBox, 22 SSH)
      ansible.builtin.shell: "ss -ltnp | grep -E '5636|:22 '"
      register: ports
      changed_when: false

    - name: Check total loaded rules and alert logs
      ansible.builtin.shell: |
        echo "=== RULE STATS ==="
        wc -l {{ rules_dir }}/thesis.rules /var/lib/suricata/rules/suricata.rules 2>/dev/null || true
        echo "=== LOGS STATUS ==="
        ls -la /var/log/suricata/eve.json /var/log/suricata/fast.log 2>/dev/null || true
      register: stats
      changed_when: false

    - name: Report provisioning summary
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "IDS/IPS Node     : {{ inventory_hostname }} ({{ ansible_host }})"
          - "OS               : {{ reach.stdout_lines | join(' | ') }}"
          - "Suricata Version : {{ suri_ver.stdout }}"
          - "EveBox Dashboard : http://{{ ansible_host }}:5636/ (access via WireGuard VPN)"
          - "Active Ports     : {{ ports.stdout_lines | default([]) }}"
          - "Internet Sources : {{ suricata_sources | join(', ') }}"
          - "Custom Rules     : {{ rules_dir }}/thesis.rules"
          - "=================================================================="