---
# =========================================================================
# Configure USG6000V2 firewalls as a full active/standby HA pair.
#
# Runs on localhost and drives the expect script `usg.exp --config`.
#
# DESIGN NOTE (USG constraint): each firewall SINGLE-HOMES per purpose.
# USG rejects the same IP on two sub-interfaces, so the crossed GE1/0/0
# cables stay plugged but are UNCONFIGURED spare/backup paths. Redundancy
# comes from the HA pair + the core-switch L2 ring (Po1):
#
#   Primary  (active):  GE1/0/1 (untrust) -> SW1, GE1/0/4 (trust) -> CS1
#   Secondary(standby): GE1/0/1 (untrust) -> SW2, GE1/0/4 (trust) -> CS2
#
# Full config (sub-interfaces, zones, OSPF, policies, heartbeat) is applied
# on the ACTIVE firewall and mirrored to STANDBY via HRP. The standby only
# needs its heartbeat link + HRP enabled locally.
#
# Order matters for HRP:
#   1. ACTIVE  gets full config (sub-interfaces, zones, OSPF, policies,
#      heartbeat link) but HRP is NOT enabled yet.
#   2. STANDBY gets sysname, heartbeat link, HRP interface + hrp enable.
#   3. ACTIVE  gets hrp enable last -> negotiation -> sync to standby.
#
# The management interface / SSH (vty+aaa) are already configured manually
# and are intentionally NOT touched here.
#
# Usage:
#   ansible-playbook -i Inventory/Connection.ini playbooks/usg_firewall_playbook.yml
# =========================================================================

- name: Configure USG6000V2 Full HA (active/standby)
  hosts: usg
  gather_facts: false
  connection: local
  vars:
    usg_exp: "{{ playbook_dir }}/../usg.exp"
    active_host: "{{ groups['usg'] | map('extract', hostvars) | selectattr('usg_role', 'equalto', 'active') | map(attribute='inventory_hostname') | first }}"
    standby_host: "{{ groups['usg'] | difference([active_host]) | first }}"
    # One-time bootstrap for the STANDBY. Set to true only for the FIRST
    # deployment; afterwards the standby is in HRP standby state and rejects
    # local config changes (config now flows from active via HRP mirror).
    bootstrap_standby: false

    # NOTE: no '#' comments allowed inside these command strings — usg.exp
    # sends every non-empty line to the firewall CLI verbatim.
    #
    # active_main_cmds notes:
    #   - `dhcp enable` must precede `dhcp select interface` on GE1/0/4.100
    #     (VLAN 100 Admin pool: 192.168.10.0/24, GW 192.168.10.1, DNS 8.8.8.8).
    #   - `undo ospf mtu-enable` on the untrust sub-interfaces prevents OSPF
    #     peers sticking in ExStart (USG advertises MTU 0 vs Cisco 1500).
    #   - static default route via ISP-1 is the safety net for the default
    #     route that OSPF should install from the ISPs' ASE LSA.
    active_main_cmds: |-
      sysname {{ hostvars[active_host].usg_sysname }}
      interface {{ hostvars[active_host].hrp_interface }}
       ip address {{ hostvars[active_host].hrp_local_ip }} {{ hostvars[active_host].hrp_netmask }}
       undo shutdown
       quit
      firewall zone dmz
       add interface {{ hostvars[active_host].hrp_interface }}
       quit
      hrp interface {{ hostvars[active_host].hrp_interface }} remote {{ hostvars[active_host].hrp_remote_ip }}
      hrp mirror config enable
      dhcp enable
      undo interface GigabitEthernet1/0/0.100
      interface GigabitEthernet1/0/1.10
       vlan-type dot1q 10
       undo ip address
       ip address 10.1.1.2 255.255.255.0
       undo ospf mtu-enable
       undo shutdown
       quit
      interface GigabitEthernet1/0/1.20
       vlan-type dot1q 20
       undo ip address
       ip address 20.1.1.2 255.255.255.0
       undo ospf mtu-enable
       undo shutdown
       quit
      interface GigabitEthernet1/0/4.100
       vlan-type dot1q 100
       undo ip address
       ip address 192.168.10.1 255.255.255.0
       dhcp select interface
       dhcp server dns-list 8.8.8.8
       dhcp server lease day 1
       undo shutdown
       quit
      interface GigabitEthernet1/0/4.200
       vlan-type dot1q 200
       undo ip address
       ip address 192.168.20.1 255.255.255.0
       undo shutdown
       quit
      interface GigabitEthernet1/0/4.300
       vlan-type dot1q 300
       undo ip address
       ip address 192.168.30.1 255.255.255.0
       undo shutdown
       quit
      firewall zone untrust
       add interface GigabitEthernet1/0/1.10
       add interface GigabitEthernet1/0/1.20
       quit
      firewall zone trust
       add interface GigabitEthernet1/0/4.100
       add interface GigabitEthernet1/0/4.200
       quit
      firewall zone dmz
       add interface GigabitEthernet1/0/4.300
       quit
      ospf 1
       area 0.0.0.0
        network 10.1.1.0 0.0.0.255
        network 20.1.1.0 0.0.0.255
        network 192.168.10.0 0.0.0.255
        network 192.168.20.0 0.0.0.255
        network 192.168.30.0 0.0.0.255
        quit
       quit
      ip route-static 0.0.0.0 0.0.0.0 10.1.1.1
      ip route-static 0.0.0.0 0.0.0.0 20.1.1.1
      security-policy
       rule name Trust_to_Local
        source-zone trust
        destination-zone local
        action permit
       quit
       rule name Trust_to_Untrust
        source-zone trust
        destination-zone untrust
        action permit
       quit
       rule name Untrust_to_Trust
        source-zone untrust
        destination-zone trust
        action permit
       quit
       rule name Trust_to_DMZ
        source-zone trust
        destination-zone dmz
        action permit
       quit
       rule name Untrust_to_DMZ
        source-zone untrust
        destination-zone dmz
        action permit
       quit
       rule name DMZ_to_Untrust
        source-zone dmz
        destination-zone untrust
        action permit
       quit
      quit

    active_hrp_cmds: |-
      hrp enable

    standby_cmds: |-
      sysname {{ hostvars[standby_host].usg_sysname }}
      interface {{ hostvars[standby_host].hrp_interface }}
       ip address {{ hostvars[standby_host].hrp_local_ip }} {{ hostvars[standby_host].hrp_netmask }}
       undo shutdown
       quit
      firewall zone dmz
       add interface {{ hostvars[standby_host].hrp_interface }}
       quit
      hrp interface {{ hostvars[standby_host].hrp_interface }} remote {{ hostvars[standby_host].hrp_remote_ip }}
      hrp enable
      hrp switch standby

     # =========================================================================
     # IPsec site-to-site VPN (dual ISP, IKEv2, certificate auth)
     #
     #   Active/standby tunnels:
     #     Tunnel 1 (primary):  10.1.1.2  <-> 10.1.1.3  (ISP1)
     #     Tunnel 2 (backup):   20.1.1.2  <-> 20.1.1.3  (ISP2)
     #
     # Both tunnels expose the same remote LAN (30.30.30.0/28). The USG uses
     # the higher-priority tunnel first; if it fails, the second takes over.
     #
     # NOTE: certificate generation (pki rsa + self-signed) is included here.
     # After the first run, export the local cert from each USG and import the
     # peer's cert on the other side manually. The peer cert is trusted via
     # peer-id fqdn {{ ipsec_remote_cn }}.
     # =========================================================================
    ipsec_remote_subnet: 30.30.30.0 0.0.0.15
    ipsec_remote_cn: Monirom-USG6000V
    ipsec_isp1_peer_ip: 10.1.1.3
    ipsec_isp2_peer_ip: 20.1.1.3
    ipsec_local_cn: USG6000V2-Primary

    active_ipsec_cmds: |-
       ike proposal 1
        encryption-algorithm aes-256
        authentication-algorithm sha2-256
        authentication-method rsa-signature
        integrity-algorithm hmac-sha2-256
        dh group14
        sa duration 86400
        quit
       ike peer peer-vpn1
        version 2
        ike-proposal 1
        remote-address {{ ipsec_isp1_peer_ip }}
        remote-id-type fqdn
        remote-id {{ ipsec_remote_cn }}
        quit
       ike peer peer-vpn2
        version 2
        ike-proposal 1
        remote-address {{ ipsec_isp2_peer_ip }}
        remote-id-type fqdn
        remote-id {{ ipsec_remote_cn }}
        quit
       ipsec proposal prop-vpn
        esp authentication-algorithm sha2-256
        esp encryption-algorithm aes-256
        quit
       acl number 3000
        rule 5 permit ip source 192.168.10.0 0.0.0.255 destination {{ ipsec_remote_subnet }}
        rule 10 permit ip source 192.168.20.0 0.0.0.255 destination {{ ipsec_remote_subnet }}
        rule 15 permit ip source 192.168.30.0 0.0.0.255 destination {{ ipsec_remote_subnet }}
        rule 20 permit ip source {{ ipsec_remote_subnet }} destination 192.168.10.0 0.0.0.255
        rule 25 permit ip source {{ ipsec_remote_subnet }} destination 192.168.20.0 0.0.0.255
        rule 30 permit ip source {{ ipsec_remote_subnet }} destination 192.168.30.0 0.0.0.255
        quit
       ipsec policy policy-vpn1 1 isakmp
        security acl 3000
        ike-peer peer-vpn1
        proposal prop-vpn
        pfs dh-group14
        quit
       ipsec policy policy-vpn2 1 isakmp
        security acl 3000
        ike-peer peer-vpn2
        proposal prop-vpn
        pfs dh-group14
        quit
       interface GigabitEthernet1/0/1.10
        ipsec policy policy-vpn1
        quit
       interface GigabitEthernet1/0/1.20
        ipsec policy policy-vpn2
        quit
       pki rsa local-key-pair create cert-key modulus 2048 exportable
       pki create-certificate self-signed filename local-cert

  tasks:
    # Push full L3 config (sub-interfaces, zones, OSPF, policies, heartbeat) to
    # the ACTIVE firewall. HRP is NOT enabled yet — we apply the config first,
    # then enable HRP so the standby mirrors a complete config.
    - name: Push full config to ACTIVE firewall
      ansible.builtin.shell: "{{ usg_exp }} --config"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
        USG_CMDS: "{{ active_main_cmds }}"
      register: active_main_result
      changed_when: true
      run_once: true

    - name: Push IPsec VPN config to ACTIVE firewall
      ansible.builtin.shell: "{{ usg_exp }} --config"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
        USG_CMDS: "{{ active_ipsec_cmds }}"
      register: ipsec_result
      changed_when: true
      run_once: true

    - name: Show IPsec config output
      ansible.builtin.debug:
        var: ipsec_result.stdout_lines
      run_once: true

     # Show the raw output from the ACTIVE config push for debugging
    - name: Show ACTIVE config output
      ansible.builtin.debug:
        var: active_main_result.stdout_lines
      run_once: true

    # Bootstraps the STANDBY firewall with its sysname, heartbeat IP, and
    # HRP channel. This is a one-time step (guarded by `bootstrap_standby`).
    # After the first run the standby is in HRP standby state and rejects
    # local config changes — all config flows from the active via HRP mirror.
    - name: Push heartbeat + HRP to STANDBY firewall
      ansible.builtin.shell: "{{ usg_exp }} --config"
      environment:
        USG_HOST: "{{ hostvars[standby_host].ansible_host }}"
        USG_PASS: "{{ hostvars[standby_host].usg_password }}"
        USG_CMDS: "{{ standby_cmds }}"
      register: standby_result
      changed_when: true
      when: bootstrap_standby
      run_once: true

    - name: Show STANDBY config output
      ansible.builtin.debug:
        var: standby_result.stdout_lines
      when: bootstrap_standby
      run_once: true

    - name: Enable HRP on ACTIVE firewall (final step)
      ansible.builtin.shell: "{{ usg_exp }} --config"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
        USG_CMDS: "{{ active_hrp_cmds }}"
      register: active_hrp_result
      changed_when: true
      run_once: true

    - name: Show ACTIVE HRP enable output
      ansible.builtin.debug:
        var: active_hrp_result.stdout_lines
      run_once: true

    - name: Verify HRP state on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display hrp state"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: hrp_state
      changed_when: false
      run_once: true

    - name: Show HRP state
      ansible.builtin.debug:
        var: hrp_state.stdout_lines
      run_once: true

    - name: Verify HRP state on STANDBY
      ansible.builtin.shell: "{{ usg_exp }} display hrp state"
      environment:
        USG_HOST: "{{ hostvars[standby_host].ansible_host }}"
        USG_PASS: "{{ hostvars[standby_host].usg_password }}"
      register: hrp_state_stdby
      changed_when: false
      run_once: true

    - name: Show STANDBY HRP state
      ansible.builtin.debug:
        var: hrp_state_stdby.stdout_lines
      run_once: true

    - name: Verify OSPF neighbors on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display ospf peer"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: ospf_peer
      changed_when: false
      run_once: true

    - name: Show OSPF peers
      ansible.builtin.debug:
        var: ospf_peer.stdout_lines
      run_once: true

    - name: Verify DHCP pool for VLAN 100 on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display ip pool interface GigabitEthernet1/0/4.100 used"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: dhcp_pool
      changed_when: false
      run_once: true

    - name: Show DHCP pool status
      ansible.builtin.debug:
        var: dhcp_pool.stdout_lines
      run_once: true

    # =========================================================================
    # ACL & Security Policy Verification
    # =========================================================================
    - name: Verify ACL 3000 configuration on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display acl 3000"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: acl_result
      changed_when: false
      run_once: true

    - name: Show ACL 3000 configuration
      ansible.builtin.debug:
        var: acl_result.stdout_lines
      run_once: true

    - name: Verify Security Policy rules on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display security-policy rule all"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: sec_policy_result
      changed_when: false
      run_once: true

    - name: Show Security Policy rules
      ansible.builtin.debug:
        var: sec_policy_result.stdout_lines
      run_once: true

    # =========================================================================
    # IPsec VPN Verification
    # =========================================================================
    - name: Verify IKE proposal configuration on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display ike proposal"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: ike_proposal_result
      changed_when: false
      run_once: true

    - name: Show IKE proposal configuration
      ansible.builtin.debug:
        var: ike_proposal_result.stdout_lines
      run_once: true

    - name: Verify IKE peer configuration on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display ike peer"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: ike_peer_result
      changed_when: false
      run_once: true

    - name: Show IKE peer configuration
      ansible.builtin.debug:
        var: ike_peer_result.stdout_lines
      run_once: true

    - name: Verify IPsec proposal configuration on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display ipsec proposal"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: ipsec_proposal_result
      changed_when: false
      run_once: true

    - name: Show IPsec proposal configuration
      ansible.builtin.debug:
        var: ipsec_proposal_result.stdout_lines
      run_once: true

    - name: Verify IPsec policy configuration on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display ipsec policy"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: ipsec_policy_result
      changed_when: false
      run_once: true

    - name: Show IPsec policy configuration
      ansible.builtin.debug:
        var: ipsec_policy_result.stdout_lines
      run_once: true

    - name: Display current IPsec and IKE running config on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display current-configuration configuration ipsec"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: cur_ipsec_cfg
      changed_when: false
      run_once: true

    - name: Show current IPsec running config
      ansible.builtin.debug:
        var: cur_ipsec_cfg.stdout_lines
      run_once: true

    - name: Check IKE SA status on ACTIVE (shows negotiated Phase 1 tunnel)
      ansible.builtin.shell: "{{ usg_exp }} display ike sa"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: ike_sa_result
      changed_when: false
      run_once: true

    - name: Show IKE SA status
      ansible.builtin.debug:
        var: ike_sa_result.stdout_lines
      run_once: true

    - name: Check IPsec SA status on ACTIVE (shows negotiated Phase 2 tunnel)
      ansible.builtin.shell: "{{ usg_exp }} display ipsec sa"
      environment:
        USG_HOST: "{{ hostvars[active_host].ansible_host }}"
        USG_PASS: "{{ hostvars[active_host].usg_password }}"
      register: ipsec_sa_result
      changed_when: false
      run_once: true

    - name: Show IPsec SA status
      ansible.builtin.debug:
        var: ipsec_sa_result.stdout_lines
      run_once: true