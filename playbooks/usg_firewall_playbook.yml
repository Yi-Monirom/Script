      run_once: true

    # =========================================================================
    # IP-Link Health Check & Routing Verification
    # =========================================================================
    - name: Verify IP-Link health check status on ACTIVE
      ansible.builtin.shell: "{{ usg_exp }} display ip-link"
      environment:
