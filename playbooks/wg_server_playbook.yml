---
# ==============================================================================
# Playbook: wg_server_playbook.yml
# Target  : DMZ WireGuard Server (192.168.30.51 / wg-server)
# ProxyJump: Automatically tunnels SSH via Relay VM (192.168.71.149) via group_vars/dmz.yml
# Purpose : End-to-end automation for DMZ WireGuard VPN Gateway:
#           1. Package installation (wireguard, wireguard-tools, iptables)
#           2. System IP forwarding (net.ipv4.ip_forward = 1)
#           3. Deployment & synchronization of /etc/wireguard/wg0.conf
#           4. Registration of authorized peers (Laptop, Relay VM, Kali, Phone)
#           5. Service management (wg-quick@wg0) & status verification
# ==============================================================================
- name: Automate DMZ WireGuard Server Configuration
  hosts: wg-server
  gather_facts: no

  vars:
    wg_server_ip: 192.168.30.51
    wg_interface: wg0
    wg_port: 443
    wg_subnet: 192.168.40.1/24
    wg_private_key: "EE3GVl9QO//UzeZ60SS/RTKL11tul5iliG+sj4YX2Xw="
    wg_public_key: "Zo4KLKJ23y4+cReONhih6ATbJ44qNBT3NJ65Y98VFFc="
    
    # Authorized Peers
    wg_peers:
      - name: "Laptop 40.10"
        pubkey: "zZ+2pyWb40yHGL7rqrFGUYimtA1/ilh/GU5DeHWBQx0="
        allowed_ips: "192.168.40.10/32"
      - name: "Relay VM 40.11"
        pubkey: "M5hqa8ps1bls1yjnuecNeVZMhgCWCidgCar6fAOVh2U="
        allowed_ips: "192.168.40.11/32"
      - name: "Kali 40.12"
        pubkey: "mjA7NtXbuF33JRbPIrQPhzVDXzXkbkVyFMlYUQWxp0I="
        allowed_ips: "192.168.40.12/32"
      - name: "Phone 40.13"
        pubkey: "nNdpsKGmaAPuR+QIn8ZWzVqLOt/rF4r6iQoVOb2GEDs="
        allowed_ips: "192.168.40.13/32"

  tasks:

    # --------------------------------------------------------------------------
    # 1. Connectivity Check
    # --------------------------------------------------------------------------
    - name: Verify SSH connectivity via ProxyJump (192.168.71.149)
      raw: echo WG_SERVER_REACHABLE; hostname; date
      register: online
      changed_when: false

    # --------------------------------------------------------------------------
    # 2. Package Installation & IP Forwarding
    # --------------------------------------------------------------------------
    - name: Ensure WireGuard tools and iptables are installed
      raw: |
        if ! command -v wg >/dev/null 2>&1; then
          apt update -y && apt install -y wireguard wireguard-tools iptables resolvconf
          echo WG_PACKAGES_INSTALLED
        else
          echo WG_PACKAGES_PRESENT
        fi
      register: pkg_install
      changed_when: "'WG_PACKAGES_INSTALLED' in pkg_install.stdout"

    - name: Ensure IPv4 forwarding is persistent
      raw: |
        sysctl -w net.ipv4.ip_forward=1 >/dev/null
        echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-wireguard.conf
        sysctl -p /etc/sysctl.d/99-wireguard.conf >/dev/null
        echo SYSCTL_OK
      register: sysctl_setup
      changed_when: false

    # --------------------------------------------------------------------------
    # 3. Render and Deploy /etc/wireguard/wg0.conf
    # --------------------------------------------------------------------------
    - name: Deploy /etc/wireguard/wg0.conf
      raw: |
        cat << 'EOF' > /etc/wireguard/{{ wg_interface }}.conf
        [Interface]
        Address = {{ wg_subnet }}
        ListenPort = {{ wg_port }}
        PrivateKey = {{ wg_private_key }}
        PostUp = iptables -t nat -C POSTROUTING -o ens3 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o ens3 -j MASQUERADE
        PostDown = iptables -t nat -D POSTROUTING -o ens3 -j MASQUERADE 2>/dev/null || true

        {% for peer in wg_peers %}
        [Peer] # {{ peer.name }}
        PublicKey = {{ peer.pubkey }}
        AllowedIPs = {{ peer.allowed_ips }}

        {% endfor %}
        EOF
        chmod 600 /etc/wireguard/{{ wg_interface }}.conf
        echo WG_CONF_DEPLOYED
      register: wg_conf
      changed_when: "'WG_CONF_DEPLOYED' in wg_conf.stdout"

    # --------------------------------------------------------------------------
    # 4. Service Management & Verification
    # --------------------------------------------------------------------------
    - name: Enable and restart wg-quick@{{ wg_interface }} service
      raw: |
        systemctl enable wg-quick@{{ wg_interface }} >/dev/null 2>&1
        wg-quick down {{ wg_interface }} 2>/dev/null || true
        wg-quick up {{ wg_interface }} 2>/dev/null || true
        echo WG_SERVICE_RESTARTED
      register: wg_restart
      changed_when: "'WG_SERVICE_RESTARTED' in wg_restart.stdout"

    - name: Verify UDP listening port {{ wg_port }}
      raw: "ss -ulnp | grep {{ wg_port }} || wg show {{ wg_interface }}"
      register: wg_port_check
      changed_when: false

    - name: Retrieve active WireGuard status
      raw: "wg show {{ wg_interface }}"
      register: wg_status
      changed_when: false

    # --------------------------------------------------------------------------
    # 5. Report Summary
    # --------------------------------------------------------------------------
    - name: Report WireGuard Server Status
      debug:
        msg:
          - "Target Host : {{ inventory_hostname }} (192.168.30.51 via ProxyJump 192.168.71.149)"
          - "Interface   : {{ wg_interface }} (IP: 192.168.40.1/24, Port: {{ wg_port }})"
          - "Public Key  : {{ wg_public_key }}"
          - "Active Peers: {{ wg_peers | length }} configured (Laptop .40.10, Relay .40.11, Kali .40.12, Phone .40.13)"
          - "Status      : WG Server Active & Responding"
