# ==============================================================================
# Huawei USG6000V2 - Active Firewall Security & NAT Policies
# ==============================================================================
# Architecture & Least-Privilege Segmentation:
#   - 🛡️ Admin Subnet (VLAN 100 - 192.168.10.0/24): Full Admin & Internet Access
#   - 👥 Staff Subnet (VLAN 200 - 192.168.20.0/24): Blocked from Admin/Mgmt,
#                                                  Web-Only on DMZ & Internet
#   - 🖥️ DMZ Subnet   (VLAN 300 - 192.168.30.0/24): Server Farm, Inbound Blocked
#   - 🌐 WAN / Untrust (ISP-1 / ISP-2)            : Dual Egress, VPN Peer Links
#   - 🔒 Local Zone                               : Firewall Control Plane
# ==============================================================================

system-view

# ------------------------------------------------------------------------------
# 1. ZONE ASSIGNMENTS
# ------------------------------------------------------------------------------
firewall zone trust
 set priority 85
 add interface GigabitEthernet1/0/4.100
 add interface GigabitEthernet1/0/4.200
quit

firewall zone dmz
 set priority 50
 add interface GigabitEthernet1/0/4.300
 add interface GigabitEthernet1/0/3
quit

firewall zone untrust
 set priority 5
 add interface GigabitEthernet1/0/1.10
 add interface GigabitEthernet1/0/1.20
 add interface Tunnel1
quit

# ------------------------------------------------------------------------------
# 2. ORDERED SECURITY POLICIES (Evaluated Top-Down)
# ------------------------------------------------------------------------------
security-policy

 # Rule 1: Allow Authorized Admin SSH/HTTPS to Firewall
 rule name SSH_to_Local
  destination-zone local
  source-address 192.168.10.0 mask 255.255.255.0
  source-address 192.168.71.0 mask 255.255.255.0
  service ssh
  service https
  action permit
 quit

 # Rule 2: Deny All Unauthorized SSH/HTTPS/Telnet to Firewall
 rule name Deny_SSH_to_Local
  destination-zone local
  service ssh
  service https
  service telnet
  action deny
 quit

 # Rule 3: Strictly Block Staff (VLAN 200) from reaching Admin (VLAN 100)
 rule name Block_Staff_to_Admin
  source-zone trust
  destination-zone trust
  source-address 192.168.20.0 mask 255.255.255.0
  destination-address 192.168.10.0 mask 255.255.255.0
  action deny
 quit

 # Rule 4: Allow Internal Users to Ping/DNS Default Gateway
 rule name Trust_to_Local
  source-zone trust
  destination-zone local
  service icmp
  service dns
  action permit
 quit

 # Rule 5: Firewall System Responses to Trust
 rule name Local_to_Trust
  source-zone local
  destination-zone trust
  action permit
 quit

 # Rule 6: Firewall Outbound Health Checks, DNS, NTP & Updates
 rule name Local_to_Untrust
  source-zone local
  destination-zone untrust
  service icmp
  service dns
  service ike
  service http
  service https
  service ntp
  action permit
 quit

 # Rule 7: Site-to-Site IPsec VPN Inbound (IKE UDP 500/4500)
 rule name Untrust_to_Local_VPN
  source-zone untrust
  destination-zone local
  source-address 10.1.3.3 mask 255.255.255.255
  source-address 20.1.3.3 mask 255.255.255.255
  service ike
  action permit
 quit

 # Rule 8: Allow WAN Ping Health Probing
 rule name Untrust_to_Local_ICMP
  source-zone untrust
  destination-zone local
  service icmp
  action permit
 quit

 # Rule 9: Allow Outbound OSPF Routing Protocol
 rule name Local_to_Untrust_OSPF
  source-zone local
  destination-zone untrust
  service ospf
  action permit
 quit

 # Rule 10: Allow Inbound OSPF Routing Protocol from ISPs
 rule name Untrust_to_Local_OSPF
  source-zone untrust
  destination-zone local
  service ospf
  action permit
 quit

 # Rule 11: Decapsulated Branch Office VPN into Corporate LANs
 rule name VPN_to_Trust
  source-zone untrust
  destination-zone trust
  source-address 30.30.30.0 mask 255.255.255.240
  destination-address 192.168.10.0 mask 255.255.255.0
  destination-address 192.168.20.0 mask 255.255.255.0
  action permit
 quit

 # Rule 12: Decapsulated Branch Office VPN into DMZ Servers
 rule name VPN_to_DMZ
  source-zone untrust
  destination-zone dmz
  source-address 30.30.30.0 mask 255.255.255.240
  destination-address 192.168.30.0 mask 255.255.255.0
  action permit
 quit

 # Rule 13: Admin Full Access to DMZ Servers (SSH, RDP, Web, DB)
 rule name Admin_to_DMZ_Full
  source-zone trust
  destination-zone dmz
  source-address 192.168.10.0 mask 255.255.255.0
  destination-address 192.168.30.0 mask 255.255.255.0
  action permit
 quit

 # Rule 14: Staff Restricted Access to DMZ (Web Portal Only: HTTP/HTTPS/ICMP)
 rule name Staff_to_DMZ_WebOnly
  source-zone trust
  destination-zone dmz
  source-address 192.168.20.0 mask 255.255.255.0
  destination-address 192.168.30.0 mask 255.255.255.0
  service http
  service https
  service icmp
  action permit
 quit

 # Rule 15: Block Staff from Backend DMZ Management (SSH, Databases)
 rule name Block_Staff_DMZ_Other
  source-zone trust
  destination-zone dmz
  source-address 192.168.20.0 mask 255.255.255.0
  destination-address 192.168.30.0 mask 255.255.255.0
  action deny
 quit

 # Rule 16: Admin Full Outbound Internet Access
 rule name Admin_to_Internet
  source-zone trust
  destination-zone untrust
  source-address 192.168.10.0 mask 255.255.255.0
  action permit
 quit

 # Rule 17: Staff Controlled Productivity Internet (Web & DNS Only)
 rule name Staff_to_Internet_Web
  source-zone trust
  destination-zone untrust
  source-address 192.168.20.0 mask 255.255.255.0
  service http
  service https
  service dns
  service icmp
  action permit
 quit

 # Rule 18: Block Staff from Unproductive Internet (P2P, Tor, raw sockets)
 rule name Block_Staff_Other_Internet
  source-zone trust
  destination-zone untrust
  source-address 192.168.20.0 mask 255.255.255.0
  action deny
 quit

 # Rule 19: DMZ Outbound Software Updates & NTP
 rule name DMZ_to_Untrust
  source-zone dmz
  destination-zone untrust
  source-address 192.168.30.0 mask 255.255.255.0
  service http
  service https
  service dns
  action permit
 quit

 # Rule 20: Implicit Default Deny All
 default action deny
quit

# ------------------------------------------------------------------------------
# 3. NAT POLICIES (No-NAT for VPN & Easy-IP for Internet)
# ------------------------------------------------------------------------------
nat-policy
 # Rule 1: Exclude Site-to-Site VPN traffic from NAT translation
 rule name NO_NAT_To_Remote_VPN
  source-zone trust
  destination-zone untrust
  destination-address 30.30.30.0 mask 255.255.255.240
  action no-nat
 quit

 # Rule 2: NAT for Internal Admin & Staff Outbound Internet Access
 rule name Trust_to_Untrust_NAT
  source-zone trust
  destination-zone untrust
  source-address 192.168.10.0 mask 255.255.255.0
  source-address 192.168.20.0 mask 255.255.255.0
  action source-nat easy-ip
 quit

 # Rule 3: NAT for DMZ Servers Outbound Updates
 rule name DMZ_to_Untrust_NAT
  source-zone dmz
  destination-zone untrust
  source-address 192.168.30.0 mask 255.255.255.0
  action source-nat easy-ip
 quit

 # Rule 4: NAT for Firewall Control Plane Outbound
 rule name Local_to_Untrust_NAT
  source-zone local
  destination-zone untrust
  action source-nat easy-ip
 quit
quit

quit
save
