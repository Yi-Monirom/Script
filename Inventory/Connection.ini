[switches]
sw1 ansible_host=192.168.71.102
sw2 ansible_host=192.168.71.103
cs1 ansible_host=192.168.71.104
cs2 ansible_host=192.168.71.105

[edge_switches]
sw1 ansible_host=192.168.71.102
sw2 ansible_host=192.168.71.103

[core_switches]
cs1 ansible_host=192.168.71.104
cs2 ansible_host=192.168.71.105

[switches:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_user=admin
ansible_password={{ switch_password }}
ansible_become=true
ansible_become_method=enable
ansible_become_password={{ switch_become_password }}
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa'

[usg]
usg6000v2 ansible_host=192.168.71.100
usg6000v2-2 ansible_host=192.168.71.101
[usg:vars]
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3
ansible_user=admin
ansible_password={{ usg_password }}
ansible_port=22
ansible_ssh_common_args=-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa

[dmz]
ids-server ansible_host=192.168.30.50

[dmz:vars]
ansible_connection=ssh
ansible_user=root
ansible_password={{ dmz_password }}
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa'

# New IDS/IPS VM (Ubuntu 22.04, 192.168.30.50) - NOT directly reachable.
# Reached only via SSH jump through Kali (192.168.15.129:2222), then WG tunnel to LAN.
[idps]
idps-server ansible_host=192.168.30.50

[idps:vars]
ansible_connection=ssh
ansible_user=root
ansible_password={{ idps_password }}
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o ProxyJump={{ kali_ssh_user }}@192.168.15.129:2222 -o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=accept-new'