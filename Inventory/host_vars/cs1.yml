---
# Core_Switch1 (L2) host variables
hostname: Core_Switch1

l2_vlans:
  - { id: 100, name: ADMIN }
  - { id: 200, name: STAFF }
  - { id: 300, name: DMZ-SERVER }

port_channel_id: 1
port_channel_allowed_vlans: "100,200,300"

# LAG (Port-channel5, LACP "mode active") to the PRIMARY firewall Eth-Trunk1
# (USG GE1/0/4). GE0/0 was previously a standalone FW trunk; it is now an
# EtherChannel member. Gi1/3 is the mgmt (VLAN1) uplink and stays untouched.
# Gi0/3 is a CROSS link to the SECONDARY firewall GE1/0/0 (separate Port-channel 6).
fw_port_channel_id: 5
fw_port_channel_allowed_vlans: "100,200,300"
fw_lag_trunk_ports:
  - name: GigabitEthernet0/0
    description: LAG_to_Primary_FW_GE1/0/4
fw_cross_port_channel_id: 6
fw_cross_lag_trunk_ports:
  - name: GigabitEthernet0/3
    description: Cross_LAG_to_Secondary_FW_GE1/0/0

edge_trunk_ports:
  - name: GigabitEthernet1/0
    description: Link_to_Access_Switch1
    allowed_vlans: "100"
  - name : GigabitEthernet1/1
    description: Link_to_Access_Switch2
    allowed_vlans: "200"
  - name : GigabitEthernet1/2
    description: Link_to_Access_Switch3
    allowed_vlans: "300"

etherchannel_members:
  - name: GigabitEthernet0/1
    description: Redundancy_link_1
  - name: GigabitEthernet0/2
    description: Redundancy_link_2

